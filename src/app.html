<!doctype html>
<html lang="it" class="h-full">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#e11d48" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
		<meta
			name="description"
			content="Pillole — il tuo bagaglio di pillole di conoscenza, da tenere per te o da condividere."
		/>

		<!-- Anteprima social (WhatsApp, Twitter/X, LinkedIn, Facebook...): URL assoluto richiesto dai crawler, per questo qui e' hardcoded invece di %sveltekit.assets%. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Pillole" />
		<meta property="og:url" content="https://pillole.me/" />
		<meta property="og:title" content="Pillole — il tuo bagaglio di conoscenza" />
		<meta
			property="og:description"
			content="Una cosa che sai, spiegata in due minuti. Archiviala per te o condividila con tutti."
		/>
		<meta property="og:image" content="https://pillole.me/img/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Pillole — il tuo bagaglio di conoscenza" />
		<meta
			name="twitter:description"
			content="Una cosa che sai, spiegata in due minuti. Archiviala per te o condividila con tutti."
		/>
		<meta name="twitter:image" content="https://pillole.me/img/og-image.png" />

		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/img/icon-192.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="%sveltekit.assets%/img/icon-512.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/img/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<script nonce="%sveltekit.nonce%">
			// Applica il tema salvato prima del primo paint: niente flash di tema sbagliato.
			// Il nonce è necessario perché la CSP (script-src 'self') blocca
			// altrimenti qualunque script inline, anche questo.
			try {
				const t = localStorage.getItem('pillole:theme');
				if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
					document.documentElement.dataset.theme = 'dark';
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full">
		<div style="display: contents" class="h-full">%sveltekit.body%</div>
	</body>
</html>
