name: CI

# Il cancello di qualita': gira su ogni push a develop/main e su ogni PR.
# Netlify pubblica solo se questo passa (impostando "Require CI to pass"
# nelle Deploy notifications del sito).
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  # Un push nuovo annulla la verifica di quello precedente sullo stesso ramo.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipi e build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci --no-audit --no-fund

      - name: Formato e regole di stile
        run: npm run lint

      - name: Controllo dei tipi
        run: npm run check

      - name: Build di produzione
        # Nessun segreto: la build non tocca il database (vedi src/lib/server/db).
        run: npm run build

  audit:
    name: Vulnerabilità nelle dipendenze
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # OWASP A06 — Vulnerable and Outdated Components.
      # Blocca solo su high/critical: sotto quella soglia il rumore
      # supererebbe il segnale e finirebbe per essere ignorato.
      - name: npm audit
        run: npm audit --audit-level=high
